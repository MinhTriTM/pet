[package]
name = "rust-pet"
version = "0.1.0"
edition = "2021"
description = "Desktop pet engine hiệu năng cao (tái dựng từ D:\\Pet bird/fafa/felix) — 1 process, N pet viewport"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.31"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rand = "0.8"
